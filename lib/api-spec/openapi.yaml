openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tawjeeh adaptive learning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Student learning workspace
  - name: knowledge
    description: Source-aware learning content search
  - name: quizzes
    description: Practice quizzes and attempts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [learning]
      summary: Get the student's learning dashboard
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [knowledge]
      summary: List source-aware learning cards
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: curriculum_year
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Learning cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeCard"
  /knowledge/query:
    post:
      operationId: queryKnowledge
      tags: [knowledge]
      summary: Search the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeQueryInput"
      responses:
        "200":
          description: Source-aware search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeQueryResponse"
        "400":
          description: Invalid query
  /quizzes:
    get:
      operationId: listQuizzes
      tags: [quizzes]
      summary: List available quizzes
      responses:
        "200":
          description: Available quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
  /quizzes/{quizId}/attempt:
    post:
      operationId: submitQuizAttempt
      tags: [quizzes]
      summary: Submit a quiz answer set
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "404":
          description: Quiz not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentProfile:
      type: object
      required: [name, grade, streak, avatar]
      properties:
        name:
          type: string
        grade:
          type: string
        streak:
          type: number
        avatar:
          type: string
    DashboardMetric:
      type: object
      required: [label, value, detail, tone]
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
        tone:
          type: string
    StudyBlock:
      type: object
      required: [id, time, title, subject, duration, kind, completed]
      properties:
        id:
          type: string
        time:
          type: string
        title:
          type: string
        subject:
          type: string
        duration:
          type: string
        kind:
          type: string
        completed:
          type: boolean
    Activity:
      type: object
      required: [id, title, description, time, icon]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        time:
          type: string
        icon:
          type: string
    Mastery:
      type: object
      required: [subject, percent, color, note]
      properties:
        subject:
          type: string
        percent:
          type: number
        color:
          type: string
        note:
          type: string
    Dashboard:
      type: object
      required: [profile, metrics, today, activities, mastery, focus]
      properties:
        profile:
          $ref: "#/components/schemas/StudentProfile"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMetric"
        today:
          type: array
          items:
            $ref: "#/components/schemas/StudyBlock"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        mastery:
          type: array
          items:
            $ref: "#/components/schemas/Mastery"
        focus:
          type: string
    KnowledgeCard:
      type: object
      required: [id, title, summary, subject, unit, lesson, type, difficulty, source, page, tags]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        subject:
          type: string
        unit:
          type: string
        lesson:
          type: string
        type:
          type: string
        difficulty:
          type: string
        source:
          type: string
        page:
          type: number
        tags:
          type: array
          items:
            type: string
    KnowledgeQueryInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
        n_results:
          type: number
          minimum: 1
          maximum: 10
        subject:
          type: string
    KnowledgeQueryResponse:
      type: object
      required: [query, results, count]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeCard"
        count:
          type: number
    QuizQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
    Quiz:
      type: object
      required: [id, title, subject, description, duration, questions, status, points]
      properties:
        id:
          type: string
        title:
          type: string
        subject:
          type: string
        description:
          type: string
        duration:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        status:
          type: string
        points:
          type: number
    QuizAttemptInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
    QuizResult:
      type: object
      required: [quiz_id, score, correct, total, message, points_earned]
      properties:
        quiz_id:
          type: string
        score:
          type: number
        correct:
          type: number
        total:
          type: number
        message:
          type: string
        points_earned:
          type: number

