openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tawjeeh adaptive learning API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Student learning workspace
  - name: knowledge
    description: Source-aware learning content search
  - name: quizzes
    description: Practice quizzes and attempts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [learning]
      summary: Get the student's learning dashboard
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /learning/summary-bank:
    get:
      operationId: getSummaryBank
      tags: [learning]
      summary: Get the student's saved lesson summaries and concept metrics
      responses:
        "200":
          description: Summary bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryBankResponse"
  /learning/error-bank:
    get:
      operationId: getErrorBank
      tags: [learning]
      summary: Get incorrect practical submissions linked to lesson concepts
      responses:
        "200":
          description: Error bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBankResponse"
  /learning/lessons/{lessonId}/complete:
    post:
      operationId: completeLesson
      tags: [learning]
      summary: Save a completed lesson summary to the student's profile
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCompletionInput"
      responses:
        "201":
          description: Saved lesson summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryBankItem"
  /learning/attempts:
    post:
      operationId: recordLearningAttempt
      tags: [learning]
      summary: Record a practical attempt and link errors to a summary concept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningAttemptInput"
      responses:
        "201":
          description: Attempt metrics and any generated remediation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningAttemptResponse"
  /learning/schedule:
    get:
      operationId: getLearningSchedule
      tags: [learning]
      summary: Get generated remediation sessions for the student's schedule
      responses:
        "200":
          description: Generated schedule entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleEntry"
  /learning/schedule/{scheduleId}:
    patch:
      operationId: updateLearningSchedule
      tags: [learning]
      summary: Mark a generated remediation session complete or incomplete
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdateInput"
      responses:
        "200":
          description: Updated schedule entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEntry"
        "404":
          description: Schedule entry not found
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [knowledge]
      summary: List source-aware learning cards
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
        - name: curriculum_year
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Learning cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeCard"
  /knowledge/query:
    post:
      operationId: queryKnowledge
      tags: [knowledge]
      summary: Search the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeQueryInput"
      responses:
        "200":
          description: Source-aware search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeQueryResponse"
        "400":
          description: Invalid query
  /quizzes:
    get:
      operationId: listQuizzes
      tags: [quizzes]
      summary: List available quizzes
      responses:
        "200":
          description: Available quizzes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quiz"
  /quizzes/attempts:
    get:
      operationId: listQuizAttempts
      tags: [quizzes]
      summary: List persisted quiz attempts
      responses:
        "200":
          description: Persisted quiz attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttemptsResponse"
  /quizzes/{quizId}/attempt:
    post:
      operationId: submitQuizAttempt
      tags: [quizzes]
      summary: Submit a quiz answer set
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "404":
          description: Quiz not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentProfile:
      type: object
      required: [name, grade, streak, avatar]
      properties:
        name:
          type: string
        grade:
          type: string
        streak:
          type: number
        avatar:
          type: string
    DashboardMetric:
      type: object
      required: [label, value, detail, tone]
      properties:
        label:
          type: string
        value:
          type: string
        detail:
          type: string
        tone:
          type: string
    StudyBlock:
      type: object
      required: [id, time, title, subject, duration, kind, completed]
      properties:
        id:
          type: string
        time:
          type: string
        title:
          type: string
        subject:
          type: string
        duration:
          type: string
        kind:
          type: string
        completed:
          type: boolean
    Activity:
      type: object
      required: [id, title, description, time, icon]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        time:
          type: string
        icon:
          type: string
    Mastery:
      type: object
      required: [subject, percent, color, note]
      properties:
        subject:
          type: string
        percent:
          type: number
        color:
          type: string
        note:
          type: string
    Dashboard:
      type: object
      required: [profile, metrics, today, activities, mastery, focus]
      properties:
        profile:
          $ref: "#/components/schemas/StudentProfile"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/DashboardMetric"
        today:
          type: array
          items:
            $ref: "#/components/schemas/StudyBlock"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        mastery:
          type: array
          items:
            $ref: "#/components/schemas/Mastery"
        focus:
          type: string
    SummaryConcept:
      type: object
      required: [id, title, summary]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
    SummaryBankItem:
      type: object
      required: [id, lesson_id, lesson_title, subject, summary, concepts, completed_at, official_stamp, logo]
      properties:
        id:
          type: integer
        lesson_id:
          type: string
        lesson_title:
          type: string
        subject:
          type: string
        summary:
          type: string
        concepts:
          type: array
          items:
            $ref: "#/components/schemas/SummaryConcept"
        completed_at:
          type: string
        official_stamp:
          type: string
        logo:
          type: string
    SummaryBankResponse:
      type: object
      required: [summaries, metrics]
      properties:
        summaries:
          type: array
          items:
            $ref: "#/components/schemas/SummaryBankItem"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ConceptMetric"
    ConceptMetric:
      type: object
      required: [lesson_id, lesson_title, concept_id, concept_title, attempts, errors_count, error_rate, last_error_tag]
      properties:
        lesson_id:
          type: string
        lesson_title:
          type: string
        concept_id:
          type: string
        concept_title:
          type: string
        attempts:
          type: integer
        errors_count:
          type: integer
        error_rate:
          type: number
        last_error_tag:
          type: string
    LessonCompletionInput:
      type: object
      required: [lesson_id, lesson_title, subject, summary, concepts]
      properties:
        lesson_id:
          type: string
        lesson_title:
          type: string
        subject:
          type: string
        summary:
          type: string
        mastery:
          type: number
          minimum: 0
          maximum: 100
        concepts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SummaryConcept"
    LearningAttemptInput:
      type: object
      required: [lesson_id, lesson_title, concept_id, concept_title, error_tag, is_correct]
      properties:
        lesson_id:
          type: string
        lesson_title:
          type: string
        concept_id:
          type: string
        concept_title:
          type: string
        error_tag:
          type: string
        is_correct:
          type: boolean
    LearningAttemptResponse:
      type: object
      required: [attempt_id, metric, remediation]
      properties:
        attempt_id:
          type: integer
        metric:
          $ref: "#/components/schemas/ConceptMetric"
        remediation:
          oneOf:
            - $ref: "#/components/schemas/ScheduleEntry"
            - type: "null"
    ScheduleEntry:
      type: object
      required: [id, scheduled_date, time, duration, title, subject, kind, remediation_label, lesson_id, concept_id, completed, missed, penalty_type, volume_multiplier]
      properties:
        id:
          type: integer
        scheduled_date:
          type: string
        time:
          type: string
        duration:
          type: string
        title:
          type: string
        subject:
          type: string
        kind:
          type: string
        remediation_label:
          type: ["string", "null"]
        lesson_id:
          type: ["string", "null"]
        concept_id:
          type: ["string", "null"]
        completed:
          type: boolean
        missed:
          type: boolean
        penalty_type:
          type: ["string", "null"]
        volume_multiplier:
          type: integer
    ErrorBankItem:
      type: object
      required: [id, lesson_id, lesson_title, concept_id, concept_title, error_tag, summary_id, created_at]
      properties:
        id:
          type: integer
        lesson_id:
          type: string
        lesson_title:
          type: string
        concept_id:
          type: string
        concept_title:
          type: string
        error_tag:
          type: string
        summary_id:
          type: ["integer", "null"]
        created_at:
          type: string
    ErrorBankResponse:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorBankItem"
    ScheduleUpdateInput:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
    KnowledgeCard:
      type: object
      required: [id, title, summary, subject, unit, lesson, type, difficulty, source, page, tags]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        subject:
          type: string
        unit:
          type: string
        lesson:
          type: string
        type:
          type: string
        difficulty:
          type: string
        source:
          type: string
        page:
          type: number
        tags:
          type: array
          items:
            type: string
    KnowledgeQueryInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
        n_results:
          type: number
          minimum: 1
          maximum: 10
        subject:
          type: string
    KnowledgeQueryResponse:
      type: object
      required: [query, results, count]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeCard"
        count:
          type: number
    QuizQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id:
          type: string
        prompt:
          type: string
        options:
          type: array
          items:
            type: string
    Quiz:
      type: object
      required: [id, title, subject, description, duration, questions, status, points, is_high_difficulty, unit_id, score_threshold]
      properties:
        id:
          type: string
        title:
          type: string
        subject:
          type: string
        description:
          type: string
        duration:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        status:
          type: string
        points:
          type: number
        is_high_difficulty:
          type: boolean
        unit_id:
          type: string
        score_threshold:
          type: number
    QuizAttemptInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties:
            type: string
    QuizResult:
      type: object
      required: [quiz_id, score, correct, total, message, points_earned, attempt_id, passed, is_high_difficulty]
      properties:
        quiz_id:
          type: string
        score:
          type: number
        correct:
          type: number
        total:
          type: number
        message:
          type: string
        points_earned:
          type: number
        attempt_id:
          type: integer
        passed:
          type: boolean
        is_high_difficulty:
          type: boolean
    QuizAttemptRecord:
      type: object
      required: [id, quiz_id, quiz_title, score, correct, total, points_earned, is_high_difficulty, passed, completed_at]
      properties:
        id:
          type: integer
        quiz_id:
          type: string
        quiz_title:
          type: string
        score:
          type: number
        correct:
          type: number
        total:
          type: number
        points_earned:
          type: number
        is_high_difficulty:
          type: boolean
        passed:
          type: boolean
        completed_at:
          type: string
    QuizAttemptsResponse:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/QuizAttemptRecord"

